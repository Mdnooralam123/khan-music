plugins { id 'com.android.application' }
android {
    namespace 'com.khan.music'
    compileSdk 34
    defaultConfig {
        applicationId 'com.khan.music'
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName '3.3'
    }
    signingConfigs {
        debug {
            if (file('khan.jks').exists()) {
                storeFile file('khan.jks')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        debug {
            if (file('khan.jks').exists()) { signingConfig signingConfigs.debug }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/INDEX.LIST', 'META-INF/*.kotlin_module']
        }
    }
}
dependencies {
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
}
