<!doctype html><html><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name=theme-color content="#0a0a0f">
<title>Khan Music</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel=stylesheet>
<style>
:root{--acr:150,40,110;--bg:#0a0a0f;--mut:#9aa0ad;--gl:rgba(255,255,255,.07);--bd:rgba(255,255,255,.09)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
html,body{margin:0;background:var(--bg);color:#fff;font-family:'Outfit',system-ui,Roboto,sans-serif}
body{padding-bottom:180px;overflow-x:hidden}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;transition:transform .15s,filter .2s,color .2s}
button:active{transform:scale(.88)}
img{transition:opacity .4s}
@keyframes spin{to{transform:rotate(360deg)}}
#glow{position:fixed;left:0;right:0;top:0;height:62vh;background:rgb(var(--acr));opacity:.5;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent);transition:background-color 1.4s ease;pointer-events:none;z-index:0}
#app{position:relative;z-index:1}
#top{position:sticky;top:0;z-index:6;padding:14px 14px 8px;background:rgba(10,10,15,.45);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
#brand{display:flex;align-items:center;gap:10px;margin-bottom:10px}
#upb{margin-left:auto;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--gl);border:1px solid var(--bd);color:#fff}
#badge{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ff3d57,#7c5cff);box-shadow:0 0 22px rgba(255,61,87,.6);animation:glowp 3s ease-in-out infinite}
#logo{font-size:25px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(90deg,#fff,#ffb3c0,#c4b5ff,#fff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:flow 7s linear infinite}
@keyframes flow{to{background-position:300% 0}}
@keyframes glowp{50%{box-shadow:0 0 34px rgba(124,92,255,.8)}}
#sb{display:flex;align-items:center;gap:8px;background:var(--gl);border:1px solid var(--bd);border-radius:28px;padding:0 16px;color:var(--mut);transition:box-shadow .3s,border-color .3s}
#sb:focus-within{border-color:rgba(var(--acr),.9);box-shadow:0 0 0 3px rgba(var(--acr),.25),0 0 24px rgba(var(--acr),.4)}
#sb input{flex:1;background:none;border:0;color:#fff;padding:14px 0;font:500 15px 'Outfit',system-ui;outline:0}
#hero{display:none;margin:8px 14px 0;padding:14px;border-radius:24px;align-items:center;gap:14px;position:relative;z-index:1;background:linear-gradient(120deg,rgba(var(--acr),.38),rgba(124,92,255,.22),rgba(var(--acr),.38));background-size:220% 220%;animation:flow2 7s ease infinite;border:1px solid rgba(255,255,255,.14);box-shadow:0 14px 50px rgba(var(--acr),.45)}
#hero.show{display:flex}
@keyframes flow2{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
#hi{width:84px;height:84px;border-radius:18px;object-fit:cover;box-shadow:0 10px 30px rgba(var(--acr),.7);flex:none;background:#1a1a22}
#hlb{letter-spacing:2px;font-size:11px;font-weight:700;color:rgba(255,255,255,.75)}
#ht{font-size:18px;font-weight:700;margin-top:2px}
#hp{height:4px;border-radius:4px;background:rgba(255,255,255,.18);margin-top:10px;overflow:hidden}
#hpb{height:100%;width:0;background:#fff;box-shadow:0 0 12px rgb(var(--acr))}
#hbt{width:52px;height:52px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;box-shadow:0 0 26px rgba(var(--acr),.8);flex:none}
#chips{display:flex;gap:9px;overflow-x:auto;padding:10px 14px;scrollbar-width:none;position:relative;z-index:1}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:12px;background:var(--gl);border:1px solid var(--bd);font-size:14px;font-weight:500;transition:all .25s}
.chip:active{transform:scale(.94)}
.chip.on{background:linear-gradient(135deg,rgb(var(--acr)),rgba(124,92,255,.9));border-color:transparent;box-shadow:0 4px 22px rgba(var(--acr),.55)}
h3{margin:18px 16px 8px;font-size:23px;font-weight:700;letter-spacing:-.4px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.dla{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:7px 12px;border-radius:20px;background:var(--gl);border:1px solid var(--bd);color:#fff;flex:none}
.note{margin:12px 16px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--bd);color:#cfd3dc;font-size:14px}
.hs{display:flex;gap:14px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.card{flex:none;width:148px;animation:up .55s both;animation-delay:var(--d,0ms)}
.card img{width:148px;height:148px;border-radius:16px;object-fit:cover;background:#1a1a22;box-shadow:0 10px 26px rgba(0,0,0,.5);transition:transform .25s,box-shadow .25s}
.card:active img{transform:scale(.95);box-shadow:0 0 28px rgba(var(--acr),.6)}
.card b{display:block;margin-top:8px;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.cur b{color:rgb(var(--acr))}
small{color:var(--mut);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it{display:flex;gap:10px;padding:7px 12px 7px 16px;align-items:center;animation:up .5s both;animation-delay:var(--d,0ms);transition:background .2s}
.it:active{background:rgba(255,255,255,.06)}
.it img{width:58px;height:58px;border-radius:12px;object-fit:cover;background:#1a1a22;flex:none}
.m{flex:1;min-width:0}
.a{font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it.cur .a{color:rgb(var(--acr));text-shadow:0 0 14px rgba(var(--acr),.6)}
.hb,.dlb{padding:8px;color:#8b8b97;display:grid;place-items:center;min-width:36px}
.hb.liked{color:#ff4d6d;filter:drop-shadow(0 0 8px rgba(255,77,109,.7))}
.dlb.done{color:rgb(var(--acr));filter:drop-shadow(0 0 8px rgba(var(--acr),.7))}
.dlb .pc{color:#fff;font-size:11px;font-weight:600}
.dlb .sp svg{animation:spin 1s linear infinite;display:block}
.hb.pop{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.5)}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.eqb,#eq{display:none;align-items:flex-end;gap:2px;height:16px}
#heq{display:flex;align-items:flex-end;gap:2px;height:16px}
.it.cur .eqb{display:flex}
.eqb i,#eq i,#heq i{display:block;width:3px;background:rgb(var(--acr));border-radius:2px;height:4px}
body.pl .it.cur .eqb i,body.pl #eq i,body.pl #heq i{animation:eq .9s ease-in-out infinite}
.eqb i:nth-child(2),#eq i:nth-child(2),#heq i:nth-child(2){animation-delay:.2s!important}
.eqb i:nth-child(3),#eq i:nth-child(3),#heq i:nth-child(3){animation-delay:.4s!important}
@keyframes eq{0%,100%{height:4px}50%{height:16px}}
.skl{padding:8px 0}
.sk{height:58px;border-radius:14px;margin:10px 16px;background:linear-gradient(90deg,#14141b 25%,#23232e 50%,#14141b 75%);background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
#mini{display:none;position:fixed;left:10px;right:10px;bottom:74px;height:64px;padding:8px 10px;border-radius:20px;align-items:center;gap:11px;z-index:8;overflow:hidden;background:rgba(32,32,42,.72);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border:1px solid var(--bd);box-shadow:0 10px 36px rgba(var(--acr),.4)}
#mini.show{display:flex;animation:up .45s both}
#mini img{width:48px;height:48px;border-radius:11px;object-fit:cover;flex:none;background:#1a1a22}
#mini button{padding:8px;display:grid;place-items:center}
#mb{width:46px;height:46px;border-radius:50%;background:#fff;color:#000;box-shadow:0 0 20px rgba(var(--acr),.7)}
#mp{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.12)}
#mpb{height:100%;width:0;background:rgb(var(--acr));box-shadow:0 0 10px rgb(var(--acr))}
body.pl #eq{display:flex}
body.ld #mb svg,body.ld #fb svg,body.ld #hbt svg{animation:spin 1s linear infinite;opacity:.55}
#nav{position:fixed;left:0;right:0;bottom:0;height:64px;display:flex;z-index:9;background:rgba(10,10,15,.8);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border-top:1px solid var(--bd)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#8b8b97;font-size:11.5px;font-weight:500;position:relative}
#nav button.on{color:#fff}
#nav button.on::after{content:'';position:absolute;top:0;width:28px;height:3px;border-radius:0 0 4px 4px;background:rgb(var(--acr));box-shadow:0 0 14px rgb(var(--acr))}
#nav button.on svg{filter:drop-shadow(0 0 8px rgb(var(--acr)))}
#full{position:fixed;left:0;right:0;top:0;bottom:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);overflow:hidden;padding:0 26px 18px}
#full.open{transform:none}
#fg{position:absolute;left:0;right:0;top:0;height:75%;background:rgb(var(--acr));opacity:.62;-webkit-mask-image:radial-gradient(120% 80% at 50% 0%,#000,transparent 72%);mask-image:radial-gradient(120% 80% at 50% 0%,#000,transparent 72%);transition:background-color 1.4s;pointer-events:none}
#fh{position:relative;display:flex;align-items:center;justify-content:space-between;padding:16px 0 4px;z-index:1}
#fh button{width:34px;height:34px;display:grid;place-items:center}
#fhs{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.75);font-weight:600}
#fm{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
#fi{width:min(80vw,38vh);height:min(80vw,38vh);object-fit:cover;border-radius:24px;background:#1a1a22;box-shadow:0 26px 80px rgba(var(--acr),.65);transform:scale(.88);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
body.pl #fi{transform:scale(1)}
#ft{margin-top:26px;width:100%;font-size:23px;font-weight:700;letter-spacing:-.3px;text-align:center;line-height:1.2;max-height:56px;overflow:hidden}
#fa{color:rgba(255,255,255,.7);margin:6px 0 16px;font-size:15px;text-align:center}
#skw{width:100%}
#sk{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;--p:0%}
#sk::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:linear-gradient(90deg,#fff var(--p),rgba(255,255,255,.2) var(--p))}
#sk::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;margin-top:-5px;box-shadow:0 0 14px rgb(var(--acr))}
#tm{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.7)}
#ct{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:14px}
#ct button{padding:10px;display:grid;place-items:center;color:rgba(255,255,255,.85)}
#ct button.on{color:rgb(var(--acr));filter:drop-shadow(0 0 8px rgb(var(--acr)))}
#fb{width:74px;height:74px;border-radius:50%;background:#fff;color:#000!important;box-shadow:0 0 36px rgba(var(--acr),.8)}
body.pl #fb{animation:pls 2.4s ease-in-out infinite}
@keyframes pls{50%{box-shadow:0 0 60px rgba(var(--acr),1)}}
#fx{display:flex;justify-content:space-around;width:100%;margin-top:12px}
#fx button{display:flex;flex-direction:column;align-items:center;gap:4px;color:rgba(255,255,255,.8);font-size:12px;padding:8px 10px;min-width:64px}
#fx button small{color:inherit}
#fx button.liked{color:#ff4d6d;filter:drop-shadow(0 0 8px rgba(255,77,109,.7))}
#fx button.done{color:rgb(var(--acr));filter:drop-shadow(0 0 8px rgba(var(--acr),.7))}
#fx .pc{font-size:14px;font-weight:700;color:#fff}
#fx .sp svg{animation:spin 1s linear infinite;display:block}
#qs{position:absolute;left:0;right:0;bottom:0;height:64%;z-index:5;background:rgba(18,18,26,.97);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border-radius:26px 26px 0 0;border-top:1px solid var(--bd);transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
#qs.open{transform:none}
#qh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 6px;font-size:18px}
#qh button{width:34px;height:34px;display:grid;place-items:center}
#ql{overflow-y:auto;flex:1;padding-bottom:20px}
#sug{display:none;position:absolute;left:14px;right:14px;top:100%;margin-top:-2px;background:rgba(22,22,30,.98);border:1px solid var(--bd);border-radius:20px;overflow-y:auto;max-height:62vh;box-shadow:0 18px 50px rgba(0,0,0,.6);z-index:7}
.sg{display:flex;align-items:center;gap:12px;padding:13px 16px;font-size:16px;font-weight:500}
.sg:active{background:rgba(255,255,255,.07)}
.sgi{color:var(--mut);display:grid;place-items:center}
.sgt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sgx{padding:6px;color:var(--mut)}
#qc{display:none;padding:6px;color:var(--mut)}
#sheet{position:fixed;left:0;right:0;top:0;bottom:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s}
#sheet.open{opacity:1;pointer-events:auto}
#shc{width:100%;background:rgba(24,24,32,.98);border-radius:26px 26px 0 0;border-top:1px solid var(--bd);padding:16px 8px 22px;transform:translateY(40px);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#sheet.open #shc{transform:none}
#shh{display:flex;gap:12px;align-items:center;padding:4px 14px 14px;border-bottom:1px solid var(--bd);margin-bottom:6px}
#shh img{width:54px;height:54px;border-radius:12px;object-fit:cover;background:#1a1a22;flex:none}
.shb{display:flex;align-items:center;gap:16px;width:100%;padding:15px 18px;font-size:16px;font-weight:500;text-align:left}
.shb:active{background:rgba(255,255,255,.07)}
#toast{position:fixed;top:18px;left:50%;transform:translate(-50%,-90px);background:rgba(30,30,40,.96);border:1px solid var(--bd);padding:10px 18px;border-radius:24px;font-size:14px;z-index:50;transition:transform .35s;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
</style></head><body>
<div id=glow></div>
<div id=app>
<div id=top>
 <div id=brand><div id=badge data-i=play data-s=18></div><span id=logo>Khan Music</span><button id=upb onclick="chkUpd(false)" data-i=upd data-s=22></button></div>
 <div id=sb><span data-i=search data-s=20></span><input id=q placeholder="Songs, artists, albums..." enterkeyhint=search autocomplete=off><button id=qc onclick="clearQ()" data-i=close data-s=20></button></div>
 <div id=sug></div>
</div>
<div id=hero onclick=openFull()><img id=hi alt=""><div class=m><small id=hlb>NOW PLAYING</small><div id=ht class=a></div><small id=hb></small><div id=hp><div id=hpb></div></div></div><span id=heq><i></i><i></i><i></i></span><button id=hbt onclick="event.stopPropagation();tg()"></button></div>
<div id=chips></div>
<div id=r></div>
</div>
<div id=mini onclick=openFull()><div id=mp><div id=mpb></div></div><img id=mi alt=""><div class=m><div id=mt class=a></div><small id=ma></small></div><span id=eq><i></i><i></i><i></i></span><button id=mb onclick="event.stopPropagation();tg()"></button><button onclick="event.stopPropagation();nx()" data-i=next data-s=26></button></div>
<div id=nav>
 <button id=n1 class=on onclick="go('home')"><span data-i=home data-s=26></span>Home</button>
 <button id=n2 onclick="go('search')"><span data-i=search data-s=26></span>Search</button>
 <button id=n3 onclick="go('lib')"><span data-i=lib data-s=26></span>Library</button>
</div>
<div id=full><div id=fg></div>
 <div id=fh><button onclick=closeFull() data-i=down data-s=32></button><div id=fhs>Now playing</div><div style="width:34px"></div></div>
 <div id=fm>
  <img id=fi alt="">
  <div id=ft></div><div id=fa></div>
  <div id=skw><input type=range id=sk min=0 max=100 value=0 step=0.1><div id=tm><span id=t1>0:00</span><span id=t2>0:00</span></div></div>
  <div id=ct><button id=sh onclick=shf() data-i=shuffle data-s=26></button><button onclick=pv() data-i=prev data-s=34></button><button id=fb onclick=tg()></button><button onclick=nx() data-i=next data-s=34></button><button id=rp onclick=rpt() data-i=repeat data-s=26></button></div>
  <div id=fx><button id=fl onclick=likeCur()></button><button id=fd onclick="dlTapE(curE)"><span id=fdi></span><small id=fdl>Offline</small></button><button onclick=openQ()><span data-i=queue data-s=26></span><small>Up next</small></button><button onclick=slp()><span data-i=timer data-s=26></span><small id=tl>Timer</small></button></div>
 </div>
 <div id=qs><div id=qh><b>Up next</b><button onclick=closeQ() data-i=down data-s=28></button></div><div id=ql></div></div>
</div>
<div id=sheet onclick="closeSheet()"><div id=shc onclick="event.stopPropagation()">
 <div id=shh><img id=shi alt=""><div class=m><div id=sht class=a></div><small id=shb></small></div></div>
 <button class=shb onclick="shPlay()"><span data-i=play data-s=22></span><span>Play now (similar gaane ke saath)</span></button>
 <button class=shb onclick="shNext()"><span data-i=next data-s=22></span><span>Play next</span></button>
 <button class=shb onclick="shQueue()"><span data-i=queue data-s=22></span><span>Queue me add karo</span></button>
 <button class=shb id=shd onclick="shDl()"></button>
 <button class=shb id=shl onclick="shLike()"></button>
 <button class=shb onclick="shShare()"><span data-i=share data-s=22></span><span>Share karo</span></button>
</div></div>
<div id=toast></div>
<script>

const IC={
