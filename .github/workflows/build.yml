name: Build APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Repo name for in-app update check
        run: echo -n "${{ github.repository }}" > app/src/main/assets/repo.txt
      - name: Build debug APK
        run: gradle --no-daemon --console=plain assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk KhanMusic.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KhanMusic
          path: KhanMusic.apk
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: KhanMusic.apk
